<rect x="962" y="489" width="406" height="56" rx="8" fill="white" stroke="#737780"/>
<text x="978" y="521" font-family="Arial, sans-serif" font-size="18" fill="#222">Urdu / اردو                   Select</text>
<rect x="962" y="561" width="406" height="56" rx="8" fill="white" stroke="#737780"/>
<text x="978" y="593" font-family="Arial, sans-serif" font-size="18" fill="#222">More matching languages...</text>
<text x="962" y="680" font-family="Arial, sans-serif" font-size="16" fill="#222">No matches? Try the native name</text>
