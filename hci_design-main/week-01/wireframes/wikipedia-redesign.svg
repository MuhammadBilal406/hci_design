<text x="40" y="858" font-family="Arial, sans-serif" font-size="18" fill="#222">DESIGN RATIONALE</text>
<text x="40" y="894" font-family="Arial, sans-serif" font-size="19" fill="#222">U1 / Full language name     U2 / Searchable A-Z picker     U3 / Visible route to all languages</text>
